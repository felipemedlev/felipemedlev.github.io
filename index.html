<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacations with Tapi</title>
<style>
  :root{
    --ink:#1f1e1c;
    --ink-2:#5c5a54;
    --ink-3:#8f8d85;
    --line:#e6e4dd;
    --paper:#ffffff;
    --shell:#faf9f6;
    --sea:#e8f1f7;
    --sea-ink:#1b5273;
    --sea-line:#bcd7e6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--shell);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    max-width:640px;
    margin:32px auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:40px 40px 44px;
  }
  h1{
    margin:0;
    font-size:30px;
    font-weight:600;
    letter-spacing:-0.02em;
  }
  .sub{margin:6px 0 0;color:var(--ink-2);font-size:14px}
  .card{
    display:block;
    margin-top:28px;
    padding:18px 20px;
    border:1px solid var(--sea-line);
    background:var(--sea);
    border-radius:12px;
    color:var(--sea-ink);
    text-decoration:none;
  }
  .card b{display:block;font-size:16px;font-weight:600;color:var(--ink)}
  .card span{display:block;margin-top:4px;font-size:13px}
  @media (max-width:820px){
    .sheet{margin:0;border:none;border-radius:0;padding:24px 18px 32px}
  }
</style>
</head>
<body>
<div class="sheet">
  <h1>Vacations with Tapi</h1>
  <p class="sub">Shared trip plans</p>
  <a class="card" href="vacations-with-tapi/">
    <b>Greece, September 2026</b>
    <span>Athens, Sifnos, Milos · 11–20 Sep</span>
  </a>
</div>
</body>
</html>
